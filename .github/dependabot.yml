version: 2
updates:
  # The pip ecosystem also covers Poetry
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python upgrades are manual: .python-version, pyproject.toml and Dockerfile change together
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
